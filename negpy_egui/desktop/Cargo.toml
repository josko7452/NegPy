[package]
name = "negpy-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "negpy_desktop"

[dependencies]
negpy-backend = { path = "../backend" }
eframe = { version = "0.32", features = ["wgpu"] }
egui = "0.32"
egui_extras = "0.32"
egui-phosphor = "0.10"
egui-wgpu = "0.32"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wgpu = "25"

[dev-dependencies]
tempfile = "3"
