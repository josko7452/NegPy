[package]
name = "negpy-backend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "negpy_backend"

[dependencies]
negpy_core = { path = "../../negpy_core", default-features = false }
chrono = "0.4"
dirs = "6"
fern = "0.7"
libc = "0.2"
log = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
