[package]
name = "negpy-backend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "negpy_backend"

[dependencies]
negpy_core = { path = "../../negpy_core", default-features = false }
chrono = "0.4"
dirs = "6"
fern = "0.7"
libc = "0.2"
log = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.2", features = ["v4"] }
sha2 = "0.11.1"
sha1 = "0.11.0"
rusqlite = { version = "0.39", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tiff = "0.11.3"
brotli-decompressor = "5.0.3"
rawler = "0.8.0"
jxl-oxide = "0.12.6"
zip = { version = "4", default-features = false, features = ["deflate"] }
npyz = "0.8"

[dev-dependencies]
tempfile = "3"
